name: Patch match logic

on:
  push:
    branches:
      - agent/harden-match-logic
    paths:
      - .github/workflows/patch-match-logic.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out patch branch
        uses: actions/checkout@v4
        with:
          ref: agent/harden-match-logic

      - name: Apply defensive matching fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              text = text.replace(old, new, 1)

          replace_once(
          '''  function getRecords(key) {
              var raw = localStorage.getItem(key);
              if (!raw) return [];
              try { return JSON.parse(raw); }
              catch (error) { console.warn("Could not parse stored records", error); return []; }
            }''',
          '''  function getRecords(key) {
              var raw = localStorage.getItem(key);
              if (!raw) return [];
              try {
                var records = JSON.parse(raw);
                return Array.isArray(records) ? records : [];
              } catch (error) {
                console.warn("Could not parse stored records", error);
                return [];
              }
            }''',
          "stored-record validation"
          )

          replace_once(
          '    return String(value || "")',
          '    return String(value === null || value === undefined ? "" : value)',
          "zero-safe HTML escaping"
          )

          old_scoring = '''  function countOverlap(listA, listB) {
              var lookup = {};
              var count = 0;
              for (var i = 0; i < listA.length; i += 1) lookup[listA[i]] = true;
              for (var j = 0; j < listB.length; j += 1) if (lookup[listB[j]]) count += 1;
              return count;
            }

            function calculateMatch(homeowner, applicant) {
              var score = 0;
              var reasons = [];

              if (applicant.budget >= homeowner.rentAmount) {
                score += 25;
                reasons.push("Budget covers prorated rent (+25).");
              } else {
                reasons.push("Budget is below prorated rent.");
              }

              var neighborhoodFit = applicant.desiredNeighborhoods.indexOf(normalizeText(homeowner.neighborhood)) !== -1;
              if (neighborhoodFit) {
                score += 20;
                reasons.push("Neighborhood preference matches (+20).");
              } else {
                reasons.push("Neighborhood is not listed as a preference.");
              }

              var overlap = countOverlap(homeowner.supportNeeds, applicant.skills);
              if (overlap > 0) {
                var skillPoints = Math.min(25, overlap * 8);
                score += skillPoints;
                reasons.push(overlap + " support need(s) overlap (+" + skillPoints + ").");
              } else {
                reasons.push("No selected support-skill overlap.");
              }

              if (!homeowner.hasPets || applicant.petComfort) {
                score += 10;
                reasons.push("Pet situation is compatible (+10).");
              } else {
                reasons.push("Pet comfort needs review.");
              }

              if (!homeowner.overnightPresence || applicant.overnightOk || applicant.availability === "overnights" || applicant.availability === "flexible") {
                score += 10;
                reasons.push("Overnight/presence expectation is compatible (+10).");
              } else {
                reasons.push("Overnight/presence expectation needs review.");
              }

              if (!homeowner.smokeFree || applicant.smokeFreeOk) {
                score += 5;
                reasons.push("Smoke-free alignment (+5).");
              } else {
                reasons.push("Smoke-free alignment needs review.");
              }

              if (!homeowner.backgroundRequired || applicant.backgroundConsent) {
                score += 5;
                reasons.push("Screening consent aligns (+5).");
              } else {
                reasons.push("Background-check consent missing.");
              }

              return { score: Math.min(score, 100), reasons: reasons };
            }'''

          new_scoring = '''  function safeArray(value) {
              return Array.isArray(value) ? value : [];
            }

            function countOverlap(listA, listB) {
              var lookup = {};
              var matched = {};
              var count = 0;
              var left = safeArray(listA);
              var right = safeArray(listB);

              for (var i = 0; i < left.length; i += 1) {
                var leftKey = normalizeText(left[i]);
                if (leftKey) lookup[leftKey] = true;
              }

              for (var j = 0; j < right.length; j += 1) {
                var rightKey = normalizeText(right[j]);
                if (rightKey && lookup[rightKey] && !matched[rightKey]) {
                  matched[rightKey] = true;
                  count += 1;
                }
              }

              return count;
            }

            function calculateMatch(homeowner, applicant) {
              homeowner = homeowner || {};
              applicant = applicant || {};

              var score = 0;
              var reasons = [];
              var reviewFlags = [];
              var budget = Number(applicant.budget);
              var rentAmount = Number(homeowner.rentAmount);
              var validBudgetData = Number.isFinite(budget) && Number.isFinite(rentAmount);

              if (validBudgetData && budget >= rentAmount) {
                score += 25;
                reasons.push("Budget covers prorated rent (+25).");
              } else if (!validBudgetData) {
                reasons.push("Budget or prorated rent is missing or invalid.");
                reviewFlags.push("Budget data");
              } else {
                reasons.push("Budget is below prorated rent.");
                reviewFlags.push("Budget mismatch");
              }

              var desiredNeighborhoods = safeArray(applicant.desiredNeighborhoods).map(normalizeText);
              var homeownerNeighborhood = normalizeText(homeowner.neighborhood);
              var neighborhoodFit = Boolean(homeownerNeighborhood && desiredNeighborhoods.indexOf(homeownerNeighborhood) !== -1);

              if (neighborhoodFit) {
                score += 20;
                reasons.push("Neighborhood preference matches (+20).");
              } else {
                reasons.push("Neighborhood is not listed as a preference.");
              }

              var overlap = countOverlap(homeowner.supportNeeds, applicant.skills);
              if (overlap > 0) {
                var skillPoints = Math.min(25, overlap * 8);
                score += skillPoints;
                reasons.push(overlap + " support need(s) overlap (+" + skillPoints + ").");
              } else {
                reasons.push("No selected support-skill overlap.");
                reviewFlags.push("No support-skill overlap");
              }

              if (!homeowner.hasPets || applicant.petComfort === true) {
                score += 10;
                reasons.push("Pet situation is compatible (+10).");
              } else {
                reasons.push("Pet comfort needs review.");
                reviewFlags.push("Pet compatibility");
              }

              var presenceCompatible = !homeowner.overnightPresence ||
                applicant.overnightOk === true ||
                applicant.availability === "overnights" ||
                applicant.availability === "flexible";

              if (presenceCompatible) {
                score += 10;
                reasons.push("Overnight/presence expectation is compatible (+10).");
              } else {
                reasons.push("Overnight/presence expectation needs review.");
                reviewFlags.push("Overnight presence");
              }

              if (!homeowner.smokeFree || applicant.smokeFreeOk === true) {
                score += 5;
                reasons.push("Smoke-free alignment (+5).");
              } else {
                reasons.push("Smoke-free alignment needs review.");
                reviewFlags.push("Smoke-free requirement");
              }

              if (!homeowner.backgroundRequired || applicant.backgroundConsent === true) {
                score += 5;
                reasons.push("Screening consent aligns (+5).");
              } else {
                reasons.push("Background-check consent missing.");
                reviewFlags.push("Background-check consent");
              }

              return {
                score: Math.min(score, 100),
                reasons: reasons,
                reviewFlags: reviewFlags,
                requiresReview: reviewFlags.length > 0
              };
            }'''

          replace_once(old_scoring, new_scoring, "matching function")

          replace_once(
          'escapeHtml(a.desiredNeighborhoods.join(", "))',
          'escapeHtml(safeArray(a.desiredNeighborhoods).join(", "))',
          "applicant neighborhood rendering"
          )

          replace_once(
          'renderTags(a.skills.concat([',
          'renderTags(safeArray(a.skills).concat([',
          "applicant skill rendering"
          )

          replace_once(
          'matches.push({ homeowner: homeowners[i], applicant: applicants[j], score: result.score, reasons: result.reasons });',
          'matches.push({ homeowner: homeowners[i], applicant: applicants[j], score: result.score, reasons: result.reasons, reviewFlags: safeArray(result.reviewFlags), requiresReview: result.requiresReview });',
          "match result metadata"
          )

          replace_once(
          '''      for (var r = 0; r < m.reasons.length; r += 1) html += '<li>' + escapeHtml(m.reasons[r]) + '</li>';
                html += '</ul></div>';''',
          '''      for (var r = 0; r < m.reasons.length; r += 1) html += '<li>' + escapeHtml(m.reasons[r]) + '</li>';
                html += '</ul>';
                if (m.reviewFlags.length) {
                  html += '<p class="meta"><strong>Review flags:</strong> ' + escapeHtml(m.reviewFlags.join(", ")) + '</p>';
                }
                html += '</div>';''',
          "review-flag rendering"
          )

          required_markers = [
              "function safeArray(value)",
              "reviewFlags: reviewFlags",
              "requiresReview: reviewFlags.length > 0",
              "Review flags:",
              "Number.isFinite(budget)",
          ]
          for marker in required_markers:
              if marker not in text:
                  raise SystemExit(f"Missing expected marker after patch: {marker}")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate embedded JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.S)
          if len(scripts) != 1:
              raise SystemExit(f"Expected one inline script, found {len(scripts)}")
          Path("/tmp/procyon-inline.js").write_text(scripts[0], encoding="utf-8")
          PY
          node --check /tmp/procyon-inline.js

      - name: Commit patched application
        shell: bash
        run: |
          git config user.name "Procyon Touch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Harden match scoring logic"
          git push origin HEAD:agent/harden-match-logic
